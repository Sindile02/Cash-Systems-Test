<h2 mat-dialog-title>{{ isEdit ? 'Update' : 'Add' }} Transaction</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form">

    <mat-form-field appearance="outline">
      <mat-label>Transaction Type</mat-label>
      <mat-select formControlName="transactionType">
        @for (type of types(); track type) {
          <mat-option [value]="type">{{ type }}</mat-option>
        }
      </mat-select>
      <mat-error>Transaction type is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <span matTextPrefix>R&nbsp;</span>
      <input matInput type="number" step="0.01" formControlName="amount" />
      <mat-error>Amount must be greater than 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" maxlength="255" formControlName="description"></textarea>
      <mat-error>Description is required (max 255 characters)</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
