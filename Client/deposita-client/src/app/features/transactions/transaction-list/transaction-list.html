<mat-card>
  <mat-card-header>
    <mat-card-title>Transactions</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <!-- Action buttons -->
    <div class="actions">
      <button mat-flat-button color="primary" (click)="openAdd()">
        <mat-icon>add</mat-icon> Add
      </button>
      <button mat-stroked-button (click)="openUpdate()" [disabled]="!selected()">
        <mat-icon>edit</mat-icon> Update
      </button>
      <button mat-stroked-button color="warn" (click)="delete()" [disabled]="!selected()">
        <mat-icon>delete</mat-icon> Delete
      </button>
    </div>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <!-- Data grid -->
    <table mat-table [dataSource]="transactions()" class="grid">

      <ng-container matColumnDef="transactionId">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let t">{{ t.transactionId }}</td>
      </ng-container>

      <ng-container matColumnDef="dateCreated">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let t">{{ t.dateCreated | date: 'dd MMM yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="transactionType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let t">{{ t.transactionType }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let t">{{ t.description }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef class="right">Amount</th>
        <td mat-cell *matCellDef="let t" class="right">
          {{ t.amount | currency: 'ZAR' : 'symbol-narrow' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"
          (click)="select(row)"
          [class.selected-row]="selected()?.transactionId === row.transactionId"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">
          No transactions yet. Click Add to create one.
        </td>
      </tr>
    </table>

  </mat-card-content>
</mat-card>
